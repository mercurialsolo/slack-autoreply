<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" role="img" aria-label="Flow of one Slack message: Slack pushes it over Socket Mode to the slackctl daemon, which guards, triages with Jev, writes an inbox item, waits, then spawns Claude Code headlessly; Claude reads the item, looks things up, and records a decision; the daemon applies policy and either posts as you or drafts to your self-DM; your reactions, edits and own replies feed a learning loop that updates the trust ledger, VOICE.md and dossiers." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="currentColor" style="color:#1f2937">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- lanes -->
  <rect x="250" y="20" width="540" height="310" rx="8" fill="none" stroke="currentColor" stroke-dasharray="5 4" opacity="0.5"/>
  <text x="262" y="40" font-weight="600">slackctl listen — daemon (Python, Socket Mode, no inbound port)</text>
  <rect x="820" y="20" width="340" height="310" rx="8" fill="none" stroke="currentColor" stroke-dasharray="5 4" opacity="0.5"/>
  <text x="832" y="40" font-weight="600">Claude Code — your login, one session per conversation</text>

  <!-- Slack -->
  <rect x="30" y="70" width="190" height="70" rx="6" fill="none" stroke="currentColor"/>
  <text x="125" y="98" text-anchor="middle" font-weight="600">Slack</text>
  <text x="125" y="116" text-anchor="middle" font-size="11">your account · user token</text>
  <text x="125" y="130" text-anchor="middle" font-size="11">DMs · @mentions · reactions</text>

  <!-- daemon pipeline row 1 -->
  <rect x="270" y="70" width="140" height="56" rx="6" fill="none" stroke="currentColor"/>
  <text x="340" y="92" text-anchor="middle" font-weight="600">guards</text>
  <text x="340" y="108" text-anchor="middle" font-size="10.5">allow/block · mentions-only</text>
  <text x="340" y="120" text-anchor="middle" font-size="10.5">quiet hours · rate cap</text>

  <rect x="440" y="70" width="150" height="56" rx="6" fill="none" stroke="currentColor"/>
  <text x="515" y="92" text-anchor="middle" font-weight="600">Jev triage</text>
  <text x="515" y="108" text-anchor="middle" font-size="10.5">route · sensitivity · urgency</text>
  <text x="515" y="120" text-anchor="middle" font-size="10.5">reads dossiers + VOICE.md</text>

  <rect x="620" y="70" width="150" height="56" rx="6" fill="none" stroke="currentColor"/>
  <text x="695" y="92" text-anchor="middle" font-weight="600">inbox/&lt;item&gt;.json</text>
  <text x="695" y="108" text-anchor="middle" font-size="10.5">text · thread · triage</text>
  <text x="695" y="120" text-anchor="middle" font-size="10.5">decision written back here</text>

  <!-- row 2 -->
  <rect x="620" y="165" width="150" height="56" rx="6" fill="none" stroke="currentColor"/>
  <text x="695" y="187" text-anchor="middle" font-weight="600">wait 20–90 s</text>
  <text x="695" y="203" text-anchor="middle" font-size="10.5">stand down if you replied</text>
  <text x="695" y="215" text-anchor="middle" font-size="10.5">or they sent more</text>

  <!-- policy -->
  <rect x="270" y="245" width="320" height="64" rx="6" fill="none" stroke="currentColor"/>
  <text x="430" y="267" text-anchor="middle" font-weight="600">policy (not Claude's call)</text>
  <text x="430" y="284" text-anchor="middle" font-size="10.5">MODE × trust ledger × share gate (did Claude read your files?)</text>
  <text x="430" y="298" text-anchor="middle" font-size="10.5">escalate → never auto · ack → always auto</text>

  <!-- Claude Code internals -->
  <rect x="845" y="70" width="290" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="990" y="88" text-anchor="middle" font-weight="600">slackctl show &lt;item&gt;</text>
  <text x="990" y="104" text-anchor="middle" font-size="10.5">thread · triage · policy preview · dossiers · 40 real messages</text>

  <rect x="845" y="135" width="290" height="70" rx="6" fill="none" stroke="currentColor"/>
  <text x="990" y="155" text-anchor="middle" font-weight="600">look things up — read-only, only if needed</text>
  <text x="990" y="172" text-anchor="middle" font-size="10.5">history / search / about (Slack) · Read/Grep in CONTEXT_DIRS</text>
  <text x="990" y="186" text-anchor="middle" font-size="10.5">MCP: Notion · Drive · GitHub · calendar · Web (public facts)</text>
  <text x="990" y="199" text-anchor="middle" font-size="10.5">Bash/Write/Edit removed · dontAsk denies the rest</text>

  <rect x="845" y="228" width="290" height="44" rx="6" fill="none" stroke="currentColor"/>
  <text x="990" y="246" text-anchor="middle" font-weight="600">slackctl act --action … --text "…" --sources …</text>
  <text x="990" y="262" text-anchor="middle" font-size="10.5">ignore · ack · hold · reply · escalate — writes decision, sends nothing</text>

  <!-- self-DM -->
  <rect x="30" y="245" width="190" height="64" rx="6" fill="none" stroke="currentColor"/>
  <text x="125" y="268" text-anchor="middle" font-weight="600">your self-DM</text>
  <text x="125" y="285" text-anchor="middle" font-size="10.5">draft · ⚠️ escalation · ⏰ reminder</text>
  <text x="125" y="299" text-anchor="middle" font-size="10.5">✅ send as-is · ❌ drop</text>

  <!-- main-flow arrows -->
  <line x1="220" y1="98" x2="268" y2="98" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="244" y="62" text-anchor="middle" font-size="10.5">push</text>
  <line x1="410" y1="98" x2="438" y2="98" stroke="currentColor" marker-end="url(#arr)"/>
  <line x1="590" y1="98" x2="618" y2="98" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="604" y="143" text-anchor="middle" font-size="10.5">ignore → stop</text>
  <line x1="515" y1="126" x2="515" y2="150" stroke="currentColor" marker-end="url(#arr)"/>
  <line x1="695" y1="126" x2="695" y2="163" stroke="currentColor" marker-end="url(#arr)"/>
  <!-- spawn -->
  <line x1="770" y1="193" x2="843" y2="193" stroke="currentColor" marker-end="url(#arr)"/>
  <rect x="775" y="150" width="400" height="0" fill="none"/>
  <text x="806" y="178" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace">claude -p</text>
  <text x="806" y="212" text-anchor="middle" font-size="10" font-family="ui-monospace, Menlo, monospace">--resume</text>
  <!-- inside claude -->
  <line x1="990" y1="114" x2="990" y2="133" stroke="currentColor" marker-end="url(#arr)"/>
  <line x1="990" y1="205" x2="990" y2="226" stroke="currentColor" marker-end="url(#arr)"/>
  <!-- act -> policy -->
  <path d="M845,250 L820,250 L820,277 L592,277" fill="none" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="706" y="271" text-anchor="middle" font-size="10.5">decision + tools actually used</text>
  <!-- policy -> slack (post as you) -->
  <path d="M270,262 L240,262 L240,150 L170,150 L170,142" fill="none" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="206" y="160" text-anchor="end" font-size="10.5">post as you</text>
  <!-- policy -> self-DM -->
  <line x1="270" y1="290" x2="222" y2="290" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="246" y="304" text-anchor="middle" font-size="10.5">draft</text>
  <!-- self-DM reactions -> slack -->
  <path d="M80,245 L80,142" fill="none" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="68" y="196" text-anchor="end" font-size="10.5" transform="rotate(-90 68 196)">✅ → posts as you</text>

  <!-- learning loop (accent) -->
  <rect x="30" y="400" width="190" height="80" rx="6" fill="none" stroke="#d97706"/>
  <text x="125" y="422" text-anchor="middle" font-weight="600" fill="#d97706">your signals</text>
  <text x="125" y="439" text-anchor="middle" font-size="10.5">✅ approved · ❌ dropped</text>
  <text x="125" y="452" text-anchor="middle" font-size="10.5">replied yourself · edited · deleted</text>
  <text x="125" y="465" text-anchor="middle" font-size="10.5">answered something it ignored</text>

  <rect x="270" y="400" width="200" height="80" rx="6" fill="none" stroke="#d97706"/>
  <text x="370" y="422" text-anchor="middle" font-weight="600" fill="#d97706">learning (daemon)</text>
  <text x="370" y="439" text-anchor="middle" font-size="10.5">outcomes.jsonl · corrections.jsonl</text>
  <text x="370" y="452" text-anchor="middle" font-size="10.5">bot wrote → you actually sent</text>
  <text x="370" y="465" text-anchor="middle" font-size="10.5">your own messages → voice samples</text>

  <rect x="520" y="400" width="200" height="80" rx="6" fill="none" stroke="#d97706"/>
  <text x="620" y="422" text-anchor="middle" font-weight="600" fill="#d97706">trust ledger</text>
  <text x="620" y="439" text-anchor="middle" font-size="10.5">per (route, sender)</text>
  <text x="620" y="452" text-anchor="middle" font-size="10.5">5 outcomes ≥ 85 % good → auto</text>
  <text x="620" y="465" text-anchor="middle" font-size="10.5">2 bad in last 5 → back to draft</text>

  <rect x="845" y="400" width="290" height="80" rx="6" fill="none" stroke="#d97706"/>
  <text x="990" y="422" text-anchor="middle" font-weight="600" fill="#d97706">/slack-autoreply review (you + Claude Code)</text>
  <text x="990" y="439" text-anchor="middle" font-size="10.5">scorecard + correction pairs → patterns</text>
  <text x="990" y="452" text-anchor="middle" font-size="10.5">edits VOICE.md · consolidates people/ channels/</text>
  <text x="990" y="465" text-anchor="middle" font-size="10.5">flags settings to change (block, thresholds)</text>

  <rect x="845" y="520" width="290" height="50" rx="6" fill="none" stroke="currentColor"/>
  <text x="990" y="540" text-anchor="middle" font-weight="600">~/.slack-autoreply/</text>
  <text x="990" y="556" text-anchor="middle" font-size="10.5">VOICE.md · voice_samples.json · people/ · channels/</text>

  <!-- learning arrows -->
  <path d="M125,309 L125,398" fill="none" stroke="#d97706" marker-end="url(#arrA)"/>
  <text x="135" y="358" font-size="10.5" fill="#d97706">same socket</text>
  <line x1="220" y1="440" x2="268" y2="440" stroke="#d97706" marker-end="url(#arrA)"/>
  <line x1="470" y1="440" x2="518" y2="440" stroke="#d97706" marker-end="url(#arrA)"/>
  <path d="M620,400 L620,340 L430,340 L430,311" fill="none" stroke="#d97706" marker-end="url(#arrA)"/>
  <text x="530" y="334" text-anchor="middle" font-size="10.5" fill="#d97706">earned autonomy</text>
  <path d="M370,480 L370,500 L990,500 L990,482" fill="none" stroke="#d97706" marker-end="url(#arrA)"/>
  <text x="680" y="496" text-anchor="middle" font-size="10.5" fill="#d97706">correction pairs</text>
  <line x1="990" y1="480" x2="990" y2="518" stroke="#d97706" marker-end="url(#arrA)"/>
  <path d="M1135,545 L1160,545 L1160,92 L1137,92" fill="none" stroke="#d97706" marker-end="url(#arrA)"/>
  <text x="1150" y="320" text-anchor="middle" font-size="10.5" fill="#d97706" transform="rotate(-90 1150 320)">feeds every show</text>
  <path d="M845,545 L515,545 L515,128" fill="none" stroke="#d97706" stroke-dasharray="4 3" opacity="0.8"/>
  <text x="680" y="541" text-anchor="middle" font-size="10.5" fill="#d97706">dossiers + VOICE.md also go into Jev's state</text>
</svg>
