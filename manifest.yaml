_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: Solo
  description: Replies to my Slack messages from my own account, in my voice
  background_color: "#1f1f1f"

features:
  # A bot user that exists for exactly one purpose: telling you a draft is waiting.
  # Slack never notifies you about your own messages, and Solo replies as YOU on the user
  # token, so the self-DM can never badge. A message from the bot is a different identity,
  # so it notifies normally. The bot never replies to anyone but you.
  bot_user:
    display_name: Solo
    always_online: false
  # The bot's DM is the console: drafts arrive there and ✅/❌ approve them. Turning the messages
  # tab on also lets the owner TYPE there — `pause`, `status`, or a correction — from their phone,
  # without a terminal. Off by default in Slack, which is why it read "sending messages to this
  # app has been turned off".
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
  event_subscriptions:
    # "user_events" = delivered on behalf of the installing user, not a bot.
    # Drop message.channels / message.groups if you only want DMs — in a big
    # workspace they stream every message from every channel you're in.
    user_events:
      - message.im
      - message.mpim
      - message.channels
      - message.groups
      - reaction_added
    # Bot events: only the owner typing to Solo in its own DM.
    bot_events:
      - message.im

oauth_config:
  scopes:
    # Bot scopes exist only so Solo can DM YOU that a draft is waiting.
    bot:
      - chat:write
      - im:write
      - im:history        # read what the owner types to Solo in its DM
    # Replies use USER scopes, so they post as you. The bot above never replies to anyone;
    # it only DMs you that a draft is waiting.
    user:
      - channels:history
      - channels:read
      - chat:write        # post as you
      - files:write       # `say --file`: a video or document goes out with the draft on ✅
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write          # open your self-DM for draft approval
      - mpim:history
      - mpim:read
      - reactions:read    # ✅ / ❌ on drafts
      - reactions:write   # 👀 acks
      - search:read       # build_voice.py pulls your past messages
      - users:read
